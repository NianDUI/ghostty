<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ghostty Session Sharing</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4efe6;
        --panel: rgba(255, 252, 245, 0.92);
        --line: #2a2723;
        --muted: #6d655c;
        --accent: #0c7a5a;
        --accent-soft: #d7efe4;
        --warn: #b36a00;
        --mobile-viewport-height: 100vh;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "SF Mono", "IBM Plex Mono", Menlo, monospace;
        background:
          radial-gradient(circle at top left, #fff6d5 0, transparent 28rem),
          linear-gradient(160deg, #efe5d3 0%, #f7f2e8 55%, #ebe2d3 100%);
        color: var(--line);
      }

      html,
      body {
        width: 100%;
        height: 100%;
      }

      body.terminal-mode {
        background: #171412;
        color: #f5f0e8;
        overflow: hidden;
      }

      .shell {
        max-width: 1200px;
        margin: 0 auto;
        padding: 24px;
      }

      .shell.terminal-mode {
        max-width: none;
        min-height: 100vh;
        width: 100vw;
        padding: 0;
      }

      .launcher-stack {
        max-width: 720px;
        margin: 0 auto;
      }

      .panel {
        background: var(--panel);
        border: 1px solid rgba(42, 39, 35, 0.14);
        border-radius: 18px;
        backdrop-filter: blur(18px);
        box-shadow: 0 18px 60px rgba(74, 58, 36, 0.14);
      }

      .auth,
      .sessions,
      .terminal-wrap {
        padding: 18px;
      }

      .title {
        margin: 0 0 8px 0;
        font-size: 20px;
        letter-spacing: 0.03em;
      }

      .hint {
        margin: 0 0 16px 0;
        color: var(--muted);
        line-height: 1.45;
        font-size: 13px;
      }

      label {
        display: block;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
        margin-bottom: 6px;
      }

      input,
      button {
        width: 100%;
        border-radius: 12px;
        border: 1px solid rgba(42, 39, 35, 0.18);
        padding: 12px 14px;
        font: inherit;
      }

      input {
        background: rgba(255, 255, 255, 0.78);
      }

      .checkbox-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 12px;
        padding: 0;
        text-transform: none;
        letter-spacing: 0;
        font-size: 13px;
        color: var(--line);
      }

      .checkbox-row input[type="checkbox"] {
        width: 16px;
        height: 16px;
        margin: 0;
        padding: 0;
        background: transparent;
        border: 1px solid rgba(42, 39, 35, 0.4);
        border-radius: 4px;
        accent-color: var(--accent);
      }

      button {
        margin-top: 12px;
        background: var(--accent);
        color: white;
        cursor: pointer;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.6;
      }

      .icon-button {
        width: 36px;
        height: 36px;
        margin: 0;
        padding: 0;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: rgba(255, 255, 255, 0.6);
        border: 1px solid rgba(42, 39, 35, 0.18);
        border-radius: 10px;
        color: var(--muted);
        font-size: 18px;
        line-height: 1;
      }

      .icon-button:hover:not(:disabled) {
        background: var(--accent-soft);
        color: var(--accent);
      }

      .settings-header {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 8px;
      }

      .settings-header .title {
        margin: 0;
        flex: 1;
      }

      .session-list {
        display: grid;
        gap: 10px;
      }

      .session {
        border: 1px solid rgba(42, 39, 35, 0.16);
        border-radius: 14px;
        padding: 12px;
        background: rgba(255, 255, 255, 0.74);
        color: var(--line);
        cursor: pointer;
        text-align: left;
      }

      .session.offline {
        cursor: default;
        opacity: 0.55;
      }

      .session.active {
        outline: 2px solid rgba(12, 122, 90, 0.5);
      }

      .status {
        display: inline-block;
        font-size: 12px;
        padding: 4px 8px;
        border-radius: 999px;
        margin-top: 8px;
      }

      .status.online {
        background: var(--accent-soft);
        color: var(--accent);
      }

      .status.offline {
        background: #f1e3d0;
        color: var(--warn);
      }

      .terminal-host {
        position: relative;
        min-height: 420px;
        overflow: hidden;
        background: #171412;
        border-radius: 16px;
        padding: 8px;
        border: 1px solid rgba(255, 255, 255, 0.08);
      }

      .terminal-host > #terminal {
        width: 100%;
        min-height: 404px;
      }

      .meta {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-bottom: 10px;
        color: var(--muted);
        font-size: 13px;
      }

      /* The meta row used to host a single trailing icon button (settings).
         We now group buttons in a flex container so adding more (refresh,
         …) keeps them tight against each other while still hugging the
         right edge. */
      .meta-actions {
        margin-left: auto;
        display: inline-flex;
        align-items: center;
        gap: 4px;
      }

      /* Spin animation while a manual refresh is in flight. We
         deliberately rotate the glyph (an inline span around the
         character) rather than the button itself — rotating a square
         pill button looks jarring, whereas a circular ⟳ glyph spinning
         in place reads cleanly. */
      .icon-button-glyph {
        display: inline-block;
        line-height: 1;
        transform-origin: 50% 50%;
      }

      .icon-button.is-spinning {
        pointer-events: none;
      }

      .icon-button.is-spinning .icon-button-glyph {
        animation: icon-spin 720ms linear infinite;
      }

      @keyframes icon-spin {
        from { transform: rotate(0deg); }
        to   { transform: rotate(360deg); }
      }

      .hidden {
        display: none !important;
      }

      .terminal-page {
        min-height: var(--mobile-viewport-height);
        width: 100vw;
      }

      .terminal-page .terminal-wrap {
        display: flex;
        flex-direction: column;
        min-height: var(--mobile-viewport-height);
        height: var(--mobile-viewport-height);
        width: 100vw;
        padding: 0;
        background: #171412;
        border: 0;
        border-radius: 0;
        box-shadow: none;
      }

      .terminal-page .terminal-host {
        flex: 1;
        min-height: 0;
        height: 100%;
        width: 100%;
        padding: 0;
        border: 0;
        border-radius: 0;
        background: #171412;
      }

      .terminal-page .terminal-host > #terminal {
        min-height: var(--mobile-viewport-height);
        height: 100%;
        width: 100%;
      }

      .terminal-status {
        position: absolute;
        top: 12px;
        right: 12px;
        z-index: 10;
        padding: 6px 10px;
        border-radius: 999px;
        font-size: 12px;
        letter-spacing: 0.02em;
        background: rgba(25, 21, 18, 0.82);
        color: #f5f0e8;
        border: 1px solid rgba(255, 255, 255, 0.12);
        backdrop-filter: blur(12px);
      }

      .terminal-status.connected {
        color: #7de3bb;
      }

      .terminal-status.reconnecting {
        color: #ffd37b;
      }

      .terminal-status.error {
        color: #ff9b8a;
      }

      /* Upload UI. Desktop relies on drag+paste only — no on-screen
         button at all. Mobile gets a dedicated pill button sitting on
         the same row as #mobileToolbarToggle, pinned to the right edge.
         The default rule below hides it everywhere; the mobile media
         query later in this stylesheet flips it back on. */
      .mobile-upload-launcher {
        display: none;
      }

      .mobile-upload-launcher .upload-launcher-glyph {
        font-size: 14px;
        line-height: 1;
      }

      .upload-toast-stack {
        position: absolute;
        bottom: 16px;
        left: 16px;
        right: 16px;
        z-index: 12;
        display: flex;
        flex-direction: column;
        gap: 6px;
        pointer-events: none;
      }

      .upload-toast {
        align-self: flex-start;
        max-width: min(90%, 520px);
        padding: 8px 12px;
        border-radius: 10px;
        font-size: 12px;
        line-height: 1.4;
        color: #f5f0e8;
        background: rgba(25, 21, 18, 0.9);
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.28);
        pointer-events: auto;
        backdrop-filter: blur(12px);
        white-space: pre-wrap;
        word-break: break-all;
      }

      .upload-toast.success {
        border-color: rgba(125, 227, 187, 0.5);
        color: #d8f8e7;
      }

      .upload-toast.error {
        border-color: rgba(255, 155, 138, 0.5);
        color: #ffd1c8;
      }

      .upload-toast .upload-toast-progress {
        display: block;
        margin-top: 4px;
        height: 3px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.16);
        overflow: hidden;
      }

      .upload-toast .upload-toast-progress > span {
        display: block;
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #ffd37b, #7de3bb);
        transition: width 120ms ease-out;
      }

      /* Drag-and-drop overlay. Layered above #terminal so it can show a
         drop-target hint without interfering with normal terminal mouse
         input — pointer-events flip on only while a drag is in flight. */
      .terminal-host .upload-drop-overlay {
        position: absolute;
        inset: 0;
        z-index: 9;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 14px;
        color: #f5f0e8;
        background: rgba(20, 16, 14, 0.65);
        border: 2px dashed rgba(255, 211, 123, 0.65);
        border-radius: 14px;
        backdrop-filter: blur(6px);
        pointer-events: none;
        opacity: 0;
        transition: opacity 120ms ease-out;
      }

      .terminal-host.upload-dropping .upload-drop-overlay {
        opacity: 1;
      }

      .mobile-input {
        position: fixed;
        left: 0;
        bottom: 0;
        width: 1px;
        height: 1px;
        opacity: 0;
        pointer-events: none;
        border: 0;
        padding: 0;
        margin: 0;
        background: transparent;
        color: transparent;
        caret-color: transparent;
      }

      .mobile-toolbar-toggle,
      .mobile-toolbar {
        display: none;
      }

      @media (pointer: coarse), (max-width: 860px) {
        .mobile-toolbar-toggle {
          position: absolute;
          left: 50%;
          /* Pill straddles the .terminal-wrap's bottom edge. When the
             toolbar is expanded it sits flush against the wrap
             underneath, so -12 px lands the pill half on the wrap and
             half on the toolbar's top edge. Collapsed (toolbar
             display:none), the wrap takes the full terminal-page
             height and the pill ends up just above the viewport bottom
             — exactly where the user expects an "expand" affordance. */
          bottom: -12px;
          z-index: 30;
          display: inline-flex;
          align-items: center;
          justify-content: center;
          width: 44px;
          height: 22px;
          margin: 0;
          transform: translateX(-50%);
          border-radius: 999px;
          border: 1px solid rgba(255, 255, 255, 0.12);
          background: rgba(36, 68, 76, 0.92);
          color: #f5f0e8;
          box-shadow: 0 12px 28px rgba(0, 0, 0, 0.26);
          backdrop-filter: blur(12px);
        }

        .mobile-toolbar-toggle::before {
          content: "⌃";
          font-size: 15px;
          line-height: 1;
          transform: rotate(180deg);
          transition: transform 160ms ease;
        }

        .mobile-toolbar-toggle.collapsed::before {
          transform: rotate(0deg);
        }

        /* Same exact dimensions as the toolbar toggle so the two read
           as sibling pills — toggle pinned center, upload pinned right.
           Icon-only (no text) so on a 360-pt phone the upload pill never
           bleeds across center and clips the toggle. The accessible name
           lives on aria-label / title. */
        .mobile-upload-launcher {
          position: absolute;
          right: 14px;
          /* Same vertical offset as .mobile-toolbar-toggle so the two
             pills stay on the same baseline. */
          bottom: -12px;
          z-index: 30;
          display: inline-flex;
          align-items: center;
          justify-content: center;
          width: 44px;
          height: 22px;
          padding: 0;
          margin: 0;
          border-radius: 999px;
          border: 1px solid rgba(255, 255, 255, 0.12);
          background: rgba(36, 68, 76, 0.92);
          color: #f5f0e8;
          font-size: 14px;
          line-height: 1;
          box-shadow: 0 12px 28px rgba(0, 0, 0, 0.26);
          backdrop-filter: blur(12px);
        }

        .mobile-upload-launcher[disabled] {
          opacity: 0.45;
          pointer-events: none;
        }

        .mobile-toolbar {
          /* Flow item inside .terminal-page (flex column). When visible
             it takes its natural height at the bottom; the sibling
             .terminal-wrap (flex:1) shrinks to fit, so the canvas
             height accounts for the toolbar automatically — no JS
             measurement of offsetHeight, no race during display:none
             → visible transitions. Collapsing the toolbar
             (display:none) lets the wrap reclaim that space and the
             terminal grid regrows. */
          flex: 0 0 auto;
          z-index: 20;
          display: grid;
          grid-template-columns: repeat(8, minmax(0, 1fr));
          /* Tight rows for a low overall toolbar. Column gap stays
             tight because keys are short. Row gap is the smallest
             value where ESC and CTRL still read as two distinct rows
             rather than one wrapped line. */
          row-gap: 4px;
          column-gap: 4px;
          /* Symmetric vertical padding: ESC sits 14 px below the top
             edge, CTRL sits 14 px above the bottom edge. The pills
             embed 12 px into that top padding (see -12 px in their
             `bottom` calc), so the pill's centre line sits *inside*
             the toolbar (1 px below the top edge) instead of floating
             above it; the first row still keeps a 2 px clearance
             below the pill. */
          padding: 14px 10px;
          background: rgba(34, 77, 88, 0.96);
          border-top: 1px solid rgba(255, 255, 255, 0.08);
          box-shadow: 0 -14px 36px rgba(0, 0, 0, 0.28);
          backdrop-filter: blur(16px);
          transition:
            transform 160ms ease,
            opacity 160ms ease;
        }

        .mobile-toolbar.hidden {
          /* Pull the toolbar out of the flow entirely so the
             .terminal-wrap (flex:1) reclaims its space and the
             terminal grid resizes to fill the viewport. */
          display: none !important;
        }

        .terminal-page {
          /* Flex column lets .terminal-wrap (flex:1) automatically
             absorb whatever vertical space the toolbar leaves. height
             tracks visualViewport so iOS / Android soft keyboard
             pushes the toolbar up against the keyboard's top edge
             without any fixed-position juggling. */
          display: flex;
          flex-direction: column;
          height: var(--mobile-viewport-height);
        }

        .terminal-page .terminal-wrap {
          flex: 1 1 auto;
          min-height: 0;
          height: auto;
          /* Containing block for the absolute-positioned toggle and
             upload-launcher pills that straddle the wrap's bottom
             edge. The explicit z-index promotes the wrap to its own
             stacking context above the toolbar's (z-index: 20) — the
             toolbar's backdrop-filter:blur(16px) already creates a
             stacking context, and without the wrap matching that, the
             absolute pills overflowing the wrap's bottom render
             beneath the toolbar despite their own z-index: 30. */
          position: relative;
          z-index: 25;
        }

        .terminal-page .terminal-host > #terminal {
          /* Override the desktop min-height so the canvas can shrink
             below the full viewport when the toolbar occupies the
             bottom row. */
          min-height: 0;
        }

        /* Borderless text-only keys (matches the iOS-keyboard-accessory
           look in the reference screenshot). The toolbar background
           provides all the surrounding chrome; each "button" is just a
           tap target with text inside. */
        .mobile-tool {
          margin: 0;
          min-height: 20px;
          padding: 0;
          border: 0;
          border-radius: 6px;
          background: transparent;
          color: #f5f0e8;
          font-size: 14px;
          font-weight: 500;
          letter-spacing: 0.02em;
          line-height: 1;
        }

        .mobile-tool:active {
          /* Touch feedback now lives entirely in :active (no resting
             border/background) — a subtle highlight on press tells the
             user the key registered, without competing visually with
             the borderless idle state. */
          background: rgba(255, 255, 255, 0.12);
        }

        .mobile-tool.mod-active {
          color: #baf5dd;
          background: rgba(125, 227, 187, 0.18);
        }

        .terminal-page.desktop-width-mode .terminal-host {
          /* In desktop-width mode the inner #terminal is wider than
             the viewport. We pan it with `transform: translateX(...)`
             from JS — using the browser's native scrollLeft was a
             non-starter on HuaweiBrowser, which silently resets
             scrollLeft between capture-phase and bubble-phase of
             touchend regardless of touch-action / preventDefault. */
          overflow: hidden;
          touch-action: pan-y;
        }

        .terminal-page.desktop-width-mode .terminal-host > #terminal {
          min-width: 860px;
          width: 860px;
          /* No `will-change: transform` here. With it the browser
             keeps #terminal as a permanent GPU compositor layer for
             the whole session. Letting Chromium promote on demand
             (the first JS transform handles that itself) costs one
             layer creation when a swipe starts and zero CPU while
             idle. */
        }
      }

    </style>
  </head>
  <body>
    <div id="shell" class="shell">
      <div id="launcherView">
        <div id="launcherHomeView" class="launcher-stack">
          <div class="panel sessions">
            <div class="meta">
              <strong>会话列表</strong>
              <span id="sessionMeta">未加载</span>
              <div class="meta-actions">
                <button
                  id="refreshSessions"
                  class="icon-button"
                  type="button"
                  aria-label="刷新会话列表"
                  title="刷新"
                >
                  <span class="icon-button-glyph" aria-hidden="true">⟳</span>
                </button>
                <button
                  id="openSettings"
                  class="icon-button"
                  type="button"
                  aria-label="打开设置"
                  title="设置"
                >
                  ⚙
                </button>
              </div>
            </div>
            <div id="sessionList" class="session-list"></div>
          </div>
        </div>

        <div id="launcherSettingsView" class="launcher-stack hidden">
          <div class="panel auth">
            <div class="settings-header">
              <button
                id="closeSettings"
                class="icon-button"
                type="button"
                aria-label="返回会话列表"
                title="返回"
              >
                ←
              </button>
              <h1 class="title">设置</h1>
            </div>
            <p class="hint">
              配置后端地址、用户令牌和显示偏好。保存后回到会话列表。
            </p>
            <label for="backendBase">Backend URL Base</label>
            <input
              id="backendBase"
              type="text"
              autocomplete="off"
              spellcheck="false"
              placeholder="默认当前页面自身，例如 http://127.0.0.1:18080"
            />
            <label for="token">User Token</label>
            <input
              id="token"
              type="password"
              autocomplete="off"
              spellcheck="false"
            />
            <label class="checkbox-row">
              <input id="lockHostSize" type="checkbox" />
              <span>锁定主机窗口大小（不修改 PC 端尺寸）</span>
            </label>
            <label class="checkbox-row">
              <input id="desktopWidth" type="checkbox" />
              <span>桌面宽度（手机左右滑动查看，不换行）</span>
            </label>
            <label class="checkbox-row">
              <input id="liveMirrorMode" type="checkbox" />
              <span
                >实时镜像（不缓存历史，手机端建议开启；切换后已有历史不会回填）</span
              >
            </label>
            <label class="checkbox-row">
              <input id="debugMode" type="checkbox" />
              <span>调试日志栏（下次刷新生效）</span>
            </label>
            <button id="saveToken">保存并返回</button>
            <div class="download-apk">
              <button id="downloadApk" type="button" disabled>
                下载 Android 安装包
              </button>
              <p id="downloadApkHint" class="hint">
                填好 User Token 后可下载，适用于首次安装或更新 APP。
              </p>
            </div>
          </div>
        </div>
      </div>

      <div id="terminalView" class="terminal-page hidden">
        <div class="panel terminal-wrap">
          <div class="terminal-host">
            <div id="terminalStatus" class="terminal-status hidden">连接中</div>
            <input
              id="uploadFileInput"
              type="file"
              multiple
              hidden
              aria-hidden="true"
            />
            <div id="uploadToastStack" class="upload-toast-stack"></div>
            <div id="uploadDropOverlay" class="upload-drop-overlay">
              松开以上传到 Mac 终端
            </div>
            <div id="terminal" aria-label="Ghostty shared terminal"></div>
          </div>
          <button
            id="mobileToolbarToggle"
            class="mobile-toolbar-toggle hidden"
            type="button"
            aria-label="显示或隐藏快捷按钮"
          ></button>
          <button
            id="mobileUploadLauncher"
            class="mobile-upload-launcher hidden"
            type="button"
            aria-label="上传文件到 Mac 终端"
            title="上传文件到 Mac 终端"
          >
            <span class="upload-launcher-glyph" aria-hidden="true">⤴</span>
          </button>
        </div>
        <textarea
          id="mobileInput"
          class="mobile-input"
          autocapitalize="off"
          autocomplete="off"
          autocorrect="off"
          spellcheck="false"
          aria-hidden="true"
        ></textarea>
        <div
          id="mobileToolbar"
          class="mobile-toolbar hidden"
          aria-label="终端快捷按钮"
        >
          <button class="mobile-tool" type="button" data-seq="esc">ESC</button>
          <button class="mobile-tool" type="button" data-seq="/">/</button>
          <button class="mobile-tool" type="button" data-seq="|">|</button>
          <button class="mobile-tool" type="button" data-seq="-">-</button>
          <button class="mobile-tool" type="button" data-seq="up">↑</button>
          <button class="mobile-tool" type="button" data-seq="home">
            HOME
          </button>
          <button class="mobile-tool" type="button" data-seq="end">END</button>
          <button class="mobile-tool" type="button" data-seq="pageup">
            PGUP
          </button>
          <button class="mobile-tool" type="button" data-modifier="ctrl">
            CTRL
          </button>
          <button class="mobile-tool" type="button" data-modifier="alt">
            ALT
          </button>
          <button class="mobile-tool" type="button" data-seq="tab">TAB</button>
          <button class="mobile-tool" type="button" data-seq="left">←</button>
          <button class="mobile-tool" type="button" data-seq="down">↓</button>
          <button class="mobile-tool" type="button" data-seq="right">→</button>
          <button class="mobile-tool" type="button" data-seq="pagedown">
            PGDN
          </button>
          <button class="mobile-tool" type="button" data-seq="backspace">
            ⌫
          </button>
        </div>
      </div>
    </div>
