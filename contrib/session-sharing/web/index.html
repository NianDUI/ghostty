<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ghostty Session Sharing</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4efe6;
        --panel: rgba(255, 252, 245, 0.9);
        --line: #2a2723;
        --muted: #6d655c;
        --accent: #0c7a5a;
        --accent-soft: #d7efe4;
        --warn: #b36a00;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "SF Mono", "IBM Plex Mono", Menlo, monospace;
        background:
          radial-gradient(circle at top left, #fff6d5 0, transparent 28rem),
          linear-gradient(160deg, #efe5d3 0%, #f7f2e8 55%, #ebe2d3 100%);
        color: var(--line);
      }

      .shell {
        max-width: 1100px;
        margin: 0 auto;
        padding: 24px;
      }

      .hero {
        display: grid;
        grid-template-columns: 320px 1fr;
        gap: 18px;
      }

      .panel {
        background: var(--panel);
        border: 1px solid rgba(42, 39, 35, 0.14);
        border-radius: 18px;
        backdrop-filter: blur(18px);
        box-shadow: 0 18px 60px rgba(74, 58, 36, 0.14);
      }

      .auth, .sessions, .terminal-wrap {
        padding: 18px;
      }

      .title {
        margin: 0 0 8px 0;
        font-size: 20px;
        letter-spacing: 0.03em;
      }

      .hint {
        margin: 0 0 16px 0;
        color: var(--muted);
        line-height: 1.45;
        font-size: 13px;
      }

      label {
        display: block;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
        margin-bottom: 6px;
      }

      input, button, textarea {
        width: 100%;
        border-radius: 12px;
        border: 1px solid rgba(42, 39, 35, 0.18);
        padding: 12px 14px;
        font: inherit;
      }

      input, textarea {
        background: rgba(255, 255, 255, 0.78);
      }

      button {
        margin-top: 12px;
        background: var(--accent);
        color: white;
        cursor: pointer;
      }

      .session-list {
        display: grid;
        gap: 10px;
      }

      .session {
        border: 1px solid rgba(42, 39, 35, 0.16);
        border-radius: 14px;
        padding: 12px;
        background: rgba(255, 255, 255, 0.74);
        cursor: pointer;
      }

      .session.offline {
        cursor: default;
        opacity: 0.55;
      }

      .status {
        display: inline-block;
        font-size: 12px;
        padding: 4px 8px;
        border-radius: 999px;
        margin-top: 8px;
      }

      .status.online {
        background: var(--accent-soft);
        color: var(--accent);
      }

      .status.offline {
        background: #f1e3d0;
        color: var(--warn);
      }

      .terminal {
        min-height: 420px;
        overflow: auto;
        background: #171412;
        color: #f5f0e8;
        border-radius: 16px;
        padding: 16px;
        line-height: 1.35;
        border: 1px solid rgba(255, 255, 255, 0.08);
        outline: none;
      }

      .term-row {
        white-space: pre;
        min-height: 1.35em;
      }

      .cell.cursor {
        outline: 1px solid rgba(255, 248, 220, 0.95);
        outline-offset: -1px;
      }

      .cell.blink {
        animation: blink 1s steps(1) infinite;
      }

      @keyframes blink {
        50% { opacity: 0.35; }
      }

      .input-row {
        margin-top: 14px;
        display: grid;
        grid-template-columns: 1fr 140px;
        gap: 12px;
      }

      .meta {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-bottom: 10px;
        color: var(--muted);
        font-size: 13px;
      }

      @media (max-width: 860px) {
        .hero {
          grid-template-columns: 1fr;
        }
        .input-row {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <div class="hero">
        <div class="panel auth">
          <h1 class="title">Session Sharing</h1>
          <p class="hint">输入用户令牌后拉取活动会话。页面现在使用 `libghostty-vt` WASM 解析 VT 流并渲染终端状态。</p>
          <label for="token">User Token</label>
          <input id="token" type="password" autocomplete="off" spellcheck="false">
          <button id="saveToken">保存并刷新会话</button>
        </div>
        <div class="panel sessions">
          <div class="meta">
            <strong>会话列表</strong>
            <span id="sessionMeta">未加载</span>
          </div>
          <div id="sessionList" class="session-list"></div>
        </div>
      </div>

      <div class="panel terminal-wrap" style="margin-top: 18px;">
        <div class="meta">
          <strong id="connectedName">未连接</strong>
          <span id="connectionMeta">等待选择会话</span>
        </div>
        <div id="terminal" class="terminal" tabindex="0" aria-label="Ghostty shared terminal"></div>
        <div class="input-row">
          <textarea id="input" rows="3" placeholder="移动端可在这里输入文本；桌面端也可直接聚焦上方终端后使用键盘"></textarea>
          <button id="sendInput">发送输入</button>
        </div>
      </div>
    </div>
    <script src="./app.js" type="module"></script>
  </body>
  </html>
